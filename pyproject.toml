[project]
name = "threat-feed-client"
version = "0.0.1"
description = "Python client library for the 0DIN Threat Feed API"
readme = "README.md"
authors = [
    { name = "Kate Silverstein", email = "ksilverstein@mozilla.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.7",
    "python-dotenv>=1.2.2",
    "tenacity>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.35",
    "ruff>=0.11",
]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
